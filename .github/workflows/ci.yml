name: Rust and differential execution
on: [push, pull_request]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TEST_THREADS: 2
  WL_JOBS: 2
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cli: target/debug/wanderlust
          - os: windows-latest
            cli: target/debug/wanderlust.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # pinned action; compiler version below
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          # LLVM-compiled AArch64 test programs (tests/programs) link against this std.
          targets: aarch64-unknown-none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Strict workspace Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Build native CLI
        run: cargo build -p wl-cli --locked
      - name: Install differential reference dependencies
        run: python -m pip install -r tests/differential/requirements.txt
      - name: Compare AArch64 execution against independent reference
        run: python tests/differential/run.py --cli ${{ matrix.cli }}
