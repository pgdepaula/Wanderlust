name: Rust and differential execution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cli: target/debug/wanderlust
          - os: windows-latest
            cli: target/debug/wanderlust.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
          # LLVM-compiled AArch64 test programs (tests/programs) link against this std.
          targets: aarch64-unknown-none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p wl-cli --locked
      - run: python -m pip install -r tests/differential/requirements.txt
      - run: python tests/differential/run.py --cli ${{ matrix.cli }}
